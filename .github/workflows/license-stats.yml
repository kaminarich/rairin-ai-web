name: Refresh licence stats

# Pulls the licence count from the VPS over SSH and commits the snapshot at
# src/data/license-stats.json. Vercel redeploys on that commit, so the hero
# figure follows the server without manual work.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   VPS_HOST       IP or hostname
#   VPS_USER       SSH user
#   VPS_HOST_KEY   known_hosts line, pins the server identity
#   VPS_SSH_KEY    private key contents (preferred), or VPS_PASSWORD
# Optional secrets:
#   VPS_PORT, VPS_SSH_KEY_PASSPHRASE, VPS_PASSWORD, RAIRIN_STATS_COMMAND, RAIRIN_REMOTE_DIR
#
# With VPS_HOST or VPS_USER unset the job exits clean and changes nothing.

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

concurrency:
  group: license-stats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install paramiko
        run: pip install --disable-pip-version-check "paramiko==3.5.1"

      - name: Fetch licence counts over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KEY_PASSPHRASE: ${{ secrets.VPS_SSH_KEY_PASSPHRASE }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
          RAIRIN_STATS_COMMAND: ${{ secrets.RAIRIN_STATS_COMMAND }}
          RAIRIN_REMOTE_DIR: ${{ secrets.RAIRIN_REMOTE_DIR }}
        run: |
          python3 scripts/fetch_license_stats.py \
            --skip-if-unconfigured \
            --output src/data/license-stats.json

      - name: Commit the snapshot when it changed
        run: |
          if git diff --quiet -- src/data/license-stats.json; then
            echo "Licence counts unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/license-stats.json
          git commit -m "Refresh licence stats"
          git push
